services:
  - type: web
    name: shopx-live
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/shopx.sqlite
    disk:
      name: shopx-data
      mountPath: /var/data
      sizeGB: 1
